[project]
name = "riskmanaged-mcp"
version = "0.1.0"
description = "CLI and MCP server for the RiskManaged trading platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "httpx>=0.27",
    "mcp>=1.0",
    "rich>=13",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    # respx fakes the httpx transport. Used in `assert_all_mocked` mode so an
    # unmocked request is a test failure rather than a real call to the
    # production default base URL.
    "respx>=0.21",
]

[project.scripts]
riskmanaged = "riskmanaged_mcp.cli:app"
riskmanaged-mcp = "riskmanaged_mcp.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "contract: asserts the client matches the platform's published API schema",
    "docs: asserts a documented example matches reality",
]
