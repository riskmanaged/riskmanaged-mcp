[project]
name = "riskmanaged-mcp"
version = "0.1.0"
description = "CLI and MCP server for the RiskManaged trading platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "httpx>=0.27",
    "mcp>=1.0",
    "rich>=13",
]

[project.scripts]
riskmanaged = "riskmanaged_mcp.cli:app"
riskmanaged-mcp = "riskmanaged_mcp.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
